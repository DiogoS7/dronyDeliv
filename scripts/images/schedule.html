<!doctype html>
<!-- Source for docs/example-schedule.png. Regenerate: PYTHONPATH=src python scripts/render_images.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example schedule</title>
<link rel="stylesheet" href="base.css">
<style>
  .legend { display: flex; flex-wrap: wrap; gap: 22px; margin: 18px 0 8px; font-size: 14px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .k-bar { width: 26px; height: 12px; border-radius: 3px; background: var(--blue); }
  .k-dot { width: 11px; height: 11px; transform: rotate(45deg); background: var(--amber); border-radius: 2px; }
  .k-x { color: var(--red); font-weight: 800; }
  .k-night { width: 22px; height: 14px; border-radius: 3px; background: repeating-linear-gradient(135deg, #1a2440 0 4px, #121a2e 4px 8px); border: 1px solid var(--line); }

  #chart { position: relative; margin-top: 10px; }
  .lane { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .lname { position: absolute; left: 0; font-weight: 700; font-size: 16px; }
  .lsub { position: absolute; left: 0; color: var(--muted); font-size: 13px; }
  .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,0.05); }
  .tlabel { position: absolute; color: var(--dim); font-size: 12px; transform: translateX(-50%); }
  .day { position: absolute; font-weight: 700; font-size: 15px; }
  .night { position: absolute; border-radius: 8px;
    background: repeating-linear-gradient(135deg, #1a2440 0 6px, #121a2e 6px 12px); border: 1px solid var(--line);
    display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 12px; line-height: 1.3; }
  .bar { position: absolute; height: 26px; border-radius: 6px; background: var(--blue); }
  .blabel { position: absolute; font-size: 14px; white-space: nowrap; }
  .blabel b { font-weight: 700; }
  .blabel .t { color: var(--muted); }
  .dot { position: absolute; width: 12px; height: 12px; transform: rotate(45deg); background: var(--amber); border-radius: 2px; }
  .note { position: absolute; font-size: 13px; color: var(--amber); white-space: nowrap; font-weight: 600; }
  .x { position: absolute; color: var(--red); font-weight: 800; font-size: 20px; line-height: 1; transform: translate(-50%, 0); }
  .xnote { position: absolute; font-size: 14px; white-space: nowrap; }
  .xnote b { color: var(--red); }
  .curve { position: absolute; overflow: visible; }
</style>
</head>
<body>
<div id="card">
  <h1>Example run: who delivers what, and when</h1>
  <p class="sub" id="sub"></p>
  <div class="legend">
    <span><i class="k-bar"></i>a delivery: the drone leaves, drops the parcel, flies back</span>
    <span><i class="k-dot"></i>order placed</span>
    <span><b class="k-x">✕</b>order cancelled</span>
    <span><i class="k-night"></i>night: drones don't fly</span>
  </div>
  <div id="chart"></div>
</div>

<script>
  const D = window.DATA;
  document.getElementById("sub").textContent =
    `${D.company}, ${D.date}. ${D.orders.length} orders came in; each row below is one drone ` +
    `(or a city with no drones), read left to right like a calendar.`;

  const chart = document.getElementById("chart");
  const W = 920, LABEL = 150, TOP = 56, ROW = 62, GAP = 84;
  const day0 = [D.opening_min, D.closing_min];
  const lastEnd = Math.max(...D.deliveries.filter((d) => d.day === 1).map((d) => d.end_min), D.opening_min + 60);
  const day1 = [D.opening_min, Math.max(D.opening_min + 180, Math.ceil(lastEnd / 60) * 60 + 60)];
  const hours = (day0[1] - day0[0] + day1[1] - day1[0]) / 60;
  const PX = (W - LABEL - GAP - 10) / hours;
  const x = (min, day) => day === 0
    ? LABEL + (min - day0[0]) / 60 * PX
    : LABEL + (day0[1] - day0[0]) / 60 * PX + GAP + (min - day1[0]) / 60 * PX;

  const rows = D.drones.map((d) => ({ key: d.name, name: `Drone ${d.name}`, sub: `${d.zone} · lifts ${d.max_weight}` }));
  const droneZones = new Set(D.drones.map((d) => d.zone));
  for (const c of D.cancelled) {
    if (!droneZones.has(c.zone) && !rows.find((r) => r.key === c.zone)) {
      rows.push({ key: c.zone, name: c.zone, sub: "no drones here" });
    }
  }
  const rowY = (key) => TOP + rows.findIndex((r) => r.key === key) * ROW;
  const H = TOP + rows.length * ROW + 8;
  chart.style.height = H + "px";
  const add = (html) => chart.insertAdjacentHTML("beforeend", html);

  // day headings, hour ticks, night band
  const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:00`;
  [[day0, 0, D.date.split(" ")[0]], [day1, 1, "Next morning"]].forEach(([[a, b], day, title]) => {
    add(`<div class="day" style="left:${x(a, day)}px;top:0">${title}</div>`);
    const step = day === 0 ? 120 : 60;
    for (let m = a; m <= b; m += step) {
      add(`<div class="tick" style="left:${x(m, day)}px;top:${TOP - 6}px;height:${H - TOP}px"></div>`);
      add(`<div class="tlabel" style="left:${x(m, day)}px;top:26px">${fmt(m)}</div>`);
    }
  });
  const nx = x(day0[1], 0) + 8, nw = GAP - 16;
  add(`<div class="night" style="left:${nx}px;top:${TOP + 2}px;width:${nw}px;height:${H - TOP - 6}px">night<br>${D.closing}<br>to<br>${D.opening}</div>`);

  // lanes
  rows.forEach((r, i) => {
    const y = TOP + i * ROW;
    if (i) add(`<div class="lane" style="top:${y}px"></div>`);
    add(`<div class="lname" style="top:${y + 12}px">${r.name}</div>`);
    add(`<div class="lsub" style="top:${y + 34}px">${r.sub}</div>`);
  });

  // deliveries
  for (const d of D.deliveries) {
    const y = rowY(d.drone) + (ROW - 26) / 2;
    const a = x(d.start_min, d.day), b = x(d.end_min, d.day);
    add(`<div class="bar" style="left:${a}px;top:${y}px;width:${b - a}px"></div>`);
    add(`<div class="blabel" style="left:${b + 8}px;top:${y + 3}px"><b>${d.client}</b> <span class="t">${d.departs}–${d.back}</span></div>`);
    if (d.next_day) {
      const ox = x(d.ordered_min, d.ordered_day);
      add(`<div class="dot" style="left:${ox - 6}px;top:${y + 7}px"></div>`);
      add(`<div class="note" style="right:${W - ox + 12}px;top:${y + 4}px">${d.client} orders at ${d.ordered}, too late for today</div>`);
      add(`<svg class="curve" style="left:0;top:0" width="${W}" height="${H}">
        <path d="M ${ox + 8} ${y + 13} C ${ox + 40} ${y - 18}, ${a - 40} ${y - 18}, ${a - 4} ${y + 6}"
          fill="none" stroke="#f2b441" stroke-width="1.6" stroke-dasharray="4 4"/>
        <path d="M ${a - 11} ${y + 1} L ${a - 3} ${y + 7} L ${a - 12} ${y + 9}" fill="none" stroke="#f2b441" stroke-width="1.6"/></svg>`);
    }
  }

  // cancelled orders
  for (const c of D.cancelled) {
    const y = rowY(droneZones.has(c.zone) ? D.drones.find((d) => d.zone === c.zone).name : c.zone);
    const cx = x(c.ordered_min, 0);
    add(`<div class="x" style="left:${cx}px;top:${y + 20}px">✕</div>`);
    add(`<div class="xnote" style="left:${cx + 14}px;top:${y + 21}px"><b>${c.client}</b> <span class="muted">orders at ${c.ordered}, cancelled: ${c.reason}</span></div>`);
  }
</script>
</body>
</html>
