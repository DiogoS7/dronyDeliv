[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronydeliv"
version = "2.0.0"
description = "Schedule parcel deliveries across a fleet of drones"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Diogo Santos" },
    { name = "José Almeida" },
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dronydeliv = "dronydeliv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
